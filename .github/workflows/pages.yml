name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - name: Build (release, WebAssembly)
        shell: bash
        run: |
          set +e
          trunk build --release --no-default-features --public-url "/${{ github.event.repository.name }}/" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Surface the compiler errors as annotations (readable without the raw log).
            grep -nE "^(error|warning: unused)" -A7 build.log | head -80 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=build errors::/'
            tail -15 build.log | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=build tail::/'
          fi
          exit $code
        env:
          RUSTFLAGS: --cfg=web_sys_unstable_apis --cfg getrandom_backend="wasm_js"
      - run: touch dist/.nojekyll && cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
